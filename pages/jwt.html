<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JWT Token Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-2xl">
        <h1 class="text-2xl font-bold mb-6 text-center">JWT Token Generator</h1>
        <form id="jwt-form">
            <div class="mb-4">
                <label for="header" class="mb-2 block text-gray-700 font-bold">Header:</label>
                <textarea id="header" name="header" rows="3" class="w-full p-2 border border-gray-300 rounded mt-1" placeholder='{"alg": "HS256", "typ": "JWT"}' required oninput="jwt.toggleGenerateButton()"></textarea>
            </div>
            <div class="mb-4">
                <label for="payload" class="mb-2 block text-gray-700 font-bold">Payload:</label>
                <textarea id="payload" name="payload" rows="5" class="w-full p-2 border border-gray-300 rounded mt-1" placeholder='{"sub": "1234567890", "name": "John Doe", "iat": 1516239022}' required oninput="jwt.toggleGenerateButton()"></textarea>
            </div>
            <div class="mb-8">
                <label for="secret" class="mb-2 block text-gray-700 font-bold">Secret:</label>
                <div class="flex">
                    <input type="text" id="secret" name="secret" class="w-full p-2 border border-gray-300 rounded" placeholder="Enter your secret key" required oninput="jwt.toggleGenerateButton()">
                    <button type="button" class="w-1/5 ml-2 bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600" onclick="jwt.generateSecret()">Generate</button>
                </div>
            </div>
            <button type="button" id="generate-button" class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600 opacity-50 cursor-not-allowed" onclick="jwt.generateToken()" disabled>Generate Token</button>
            <div class="mt-8">
                <label for="token" class="block text-gray-700 font-bold">Generated Token:</label>
                <div class="flex">
                    <textarea id="token" name="token" rows="5" class="w-full p-2 border border-gray-300 rounded mt-1" readonly></textarea>
                    <button type="button" class="w-1/5 ml-2 bg-green-600 text-white py-2 px-4 rounded hover:bg-green-700 self-end" onclick="jwt.copyToken()">Copy</button>
                </div>
            </div>
        </form>
        <div id="copy-notification" class="hidden fixed bottom-4 right-4 bg-gray-800 text-white py-2 px-4 rounded shadow-lg transition-opacity duration-300 opacity-0">
            Token copied to clipboard
        </div>
    </div>
    <script src="../scripts/jwt.js"></script>
</body>
</html>
