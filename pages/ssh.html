<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSH Key Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/node-forge@1.3.1/dist/forge.min.js"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-6xl">
        <h1 class="text-2xl font-bold mb-6 text-center">SSH Key Generator</h1>
        <div class="flex">
            <form id="ssh-form" class="w-1/2 pl-4 pr-8 flex flex-col justify-between">
                <div>
                    <div class="mb-4">
                        <label class="block text-gray-700 font-bold mb-2">Algorithm:</label>
                        <div class="flex flex-wrap justify-start w-full">
                            <button type="button" class="algorithm-btn w-1/5 bg-gray-200 text-gray-700 p-2 m-2 rounded hover:bg-gray-300" onclick="ssh.setAlgorithm('rsa')">RSA</button>
                            <button type="button" class="algorithm-btn w-1/5 bg-gray-200 text-gray-700 p-2 m-2 rounded hover:bg-gray-300" onclick="ssh.setAlgorithm('dsa')">DSA</button>
                            <button type="button" class="algorithm-btn w-1/5 bg-gray-200 text-gray-700 p-2 m-2 rounded hover:bg-gray-300" onclick="ssh.setAlgorithm('ecdsa')">ECDSA</button>
                            <button type="button" class="algorithm-btn w-1/5 bg-gray-200 text-gray-700 p-2 m-2 rounded hover:bg-gray-300" onclick="ssh.setAlgorithm('ed25519')">ED25519</button>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 font-bold mb-2">Bits:</label>
                        <div class="flex flex-wrap justify-start w-full">
                            <button type="button" class="bits-btn w-1/5 bg-gray-200 text-gray-700 p-2 m-2 rounded hover:bg-gray-300" onclick="ssh.setBits(2048)">2048</button>
                            <button type="button" class="bits-btn w-1/5 bg-gray-200 text-gray-700 p-2 m-2 rounded hover:bg-gray-300" onclick="ssh.setBits(4096)">4096</button>
                            <button type="button" class="bits-btn w-1/5 bg-gray-200 text-gray-700 p-2 m-2 rounded cursor-not-allowed opacity-50" disabled>8192</button>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 font-bold mb-2">Format:</label>
                        <div class="flex flex-wrap justify-start w-full">
                            <button type="button" class="format-btn w-1/5 bg-gray-200 text-gray-700 p-2 m-2 rounded hover:bg-gray-300" onclick="ssh.setFormat('pem')">PEM</button>
                            <button type="button" class="format-btn w-1/5 bg-gray-200 text-gray-700 p-2 m-2 rounded hover:bg-gray-300" onclick="ssh.setFormat('ppk')">PPK</button>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 font-bold mb-2">Passphrase:</label>
                        <input type="password" id="key-passphrase" name="key-passphrase" class="w-full p-2 border border-gray-300 rounded mt-1">
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 font-bold mb-2">Key Name:</label>
                        <input type="text" id="key-name" name="key-name" class="w-full p-2 border border-gray-300 rounded mt-1" placeholder="my_ssh_key">
                    </div>
                </div>
                <button type="button" class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600 mt-4" onclick="ssh.generateKeys()">Generate Keys</button>
            </form>
            <div class="w-1/2 pr-4 pl-8">
                <div class="mb-4">
                    <label for="public-key" class="block text-gray-700 font-bold">Public Key:</label>
                    <textarea id="public-key" name="public-key" rows="10" class="w-full p-2 border border-gray-300 rounded mt-1" readonly></textarea>
                    <button type="button" class="mt-2 w-full bg-green-600 text-white py-2 px-4 rounded hover:bg-green-700" onclick="ssh.copyPublicKey()">Copy Public Key</button>
                </div>
                <div class="mb-4">
                    <label for="private-key" class="block text-gray-700 font-bold">Private Key:</label>
                    <textarea id="private-key" name="private-key" rows="10" class="w-full p-2 border border-gray-300 rounded mt-1" readonly></textarea>
                    <button type="button" class="mt-2 w-full bg-green-600 text-white py-2 px-4 rounded hover:bg-green-700" onclick="ssh.copyPrivateKey()">Copy Private Key</button>
                </div>
                <button type="button" id="download-keys" class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600 mt-4 opacity-50 cursor-not-allowed" onclick="ssh.downloadKeys()" disabled>Download Keys</button>
            </div>
        </div>
        <div id="copy-notification" class="hidden fixed bottom-4 right-4 bg-gray-800 text-white py-2 px-4 rounded shadow-lg transition-opacity duration-300 opacity-0">
            Key copied to clipboard
        </div>
    </div>
    <script src="../scripts/ssh.js"></script>
</body>
</html>
