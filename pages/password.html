<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Password Generator</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/custom.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
  </head>

  <body>
    <div class="floating-btns">
      <a href="/index.html" class="home-btn" title="Back to Home">
        <i class="fa-solid fa-house"></i>
      </a>
    </div>
    <div class="category-layout">
      <!-- unified header (same structure as index.html) -->
      <div class="explore-row">
        <div class="explore-head">
          <h1 class="category-title">
            Password Generator
            <br /><span class="category-title-main"
              >Create random passwords</span
            >
          </h1>
          <!-- Sub-pages: no extra subtitle per request -->
        </div>
        <div class="decor-blob" aria-hidden="true"></div>
      </div>

      <!-- tool card (theme unified with index) -->
      <div class="card pw-flex-card">
        <div class="pw-left">
          <div class="card-title">
            <i class="fa-solid fa-lock"></i> Password options
          </div>

          <div class="option-group" style="align-items: center">
            <label for="length" class="option-label">Length:</label>
            <input
              type="number"
              id="length"
              min="1"
              max="128"
              value="32"
              class="option-input"
              aria-describedby="length-hint"
            />
          </div>

          <div class="option-group" aria-label="preset lengths">
            <button type="button" class="option-btn" data-length="8">8</button>
            <button type="button" class="option-btn" data-length="12">
              12
            </button>
            <button type="button" class="option-btn" data-length="16">
              16
            </button>
            <button type="button" class="option-btn" data-length="20">
              20
            </button>
            <button type="button" class="option-btn" data-length="32">
              32
            </button>
          </div>

          <div class="option-group">
            <button
              type="button"
              id="include-special"
              class="option-btn"
              data-special="true"
            >
              <i class="fa-solid fa-star"></i> Include special characters
            </button>
          </div>

          <!-- tip placed at bottom of left column -->
          <div class="bottom-tip" role="note" aria-live="polite">
            <span class="tip-icon"
              ><i class="fa-solid fa-circle-info"></i> Max password length is
              128 characters.</span
            >
          </div>
        </div>

        <div class="pw-right">
          <input type="hidden" id="password" />

          <!-- chat-like area for generated password + copy confirmation -->
          <div
            class="chat-area"
            id="chat-area"
            aria-live="polite"
            aria-atomic="true"
          >
            <!-- bubbles inserted by JS -->
          </div>

          <div class="action-row" style="margin-top: 1rem">
            <button class="option-btn main" id="generate-btn">
              <i class="fa-solid fa-magic-wand-sparkles"></i> Generate Password
            </button>
            <button class="copy-btn" id="copy-btn">Copy</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="category-footer">
      &copy; 2025 EssPouch. Made by Huy Nguyen.
    </footer>

    <script src="../scripts/password.js"></script>
  </body>
</html>
