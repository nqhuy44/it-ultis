<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-2xl">
        <h1 class="text-2xl font-bold mb-6 text-center">Password Generator</h1>
        <div class="flex">
            <div class="w-1/5 pr-4 flex flex-col justify-between">
                <div class="flex flex-col space-y-2 h-full justify-between">
                    <div class="w-full flex justify-start">
                        <button type="button" class="w-20 bg-gray-200 text-gray-700 py-2 rounded hover:bg-gray-300" onclick="passwd.setLength(8)">8</button>
                    </div>
                    <div class="w-full flex justify-start">
                        <button type="button" class="w-20 bg-gray-200 text-gray-700 py-2 rounded hover:bg-gray-300" onclick="passwd.setLength(12)">12</button>
                    </div>
                    <div class="w-full flex justify-start">
                        <button type="button" class="w-20 bg-gray-200 text-gray-700 py-2 rounded hover:bg-gray-300" onclick="passwd.setLength(16)">16</button>
                    </div>
                    <div class="w-full flex justify-start">
                        <button type="button" class="w-20 bg-gray-200 text-gray-700 py-2 rounded hover:bg-gray-300" onclick="passwd.setLength(20)">20</button>
                    </div>
                    <div class="w-full flex justify-start">
                        <button type="button" class="w-20 bg-gray-200 text-gray-700 py-2 rounded hover:bg-gray-300" onclick="passwd.setLength(32)">32</button>
                    </div>
                </div>
            </div>
            <div class="w-4/5">
                <form id="password-form">
                    <div class="mb-6 flex items-center">
                        <input type="number" id="length" name="length" class="w-2/5 p-2 border border-gray-300 rounded mt-1" placeholder="Length (max 128)" min="1" max="128">
                        <div class="flex flex-col ml-16">
                            <div class="flex items-center mb-2">
                                <input type="checkbox" id="include-special" name="include-special" class="mr-2">
                                <label for="include-special" class="text-gray-700">Special Characters</label>
                            </div>
                        </div>
                    </div>
                    <p class="text-sm text-gray-500 mt-2">Note: Maximum password length is 128 characters.</p>
                    <button type="button" class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600 mt-4" onclick="passwd.generate()">Generate Password</button>
                    <div class="mt-8">
                        <label for="password" class="font-bold text-gray-700 mb-2">Generated Password:</label>
                        <div class="flex mt-2">
                            <input type="text" id="password" name="password" class="w-full p-2 border border-gray-300 rounded mt-1" readonly>
                            <button type="button" class="w-1/5 ml-2 bg-green-600 text-white py-2 px-4 rounded hover:bg-green-700 mt-1" onclick="passwd.copy()">Copy</button>
                        </div>
                    </div>
                </form>
                <div id="copy-notification" class="hidden fixed bottom-4 right-4 bg-gray-800 text-white py-2 px-4 rounded shadow-lg transition-opacity duration-300 opacity-0">
                    Password copied to clipboard
                </div>
                <div id="error-notification" class="hidden fixed bottom-4 right-4 bg-red-500 text-white py-2 px-4 rounded shadow-lg transition-opacity duration-300 opacity-0">
                    Please enter a valid password length (1-128).
                </div>
            </div>
        </div>
    </div>
    <script src="../scripts/password.js"></script>
</body>
</html>
