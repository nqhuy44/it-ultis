<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JWT Token Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-2xl">
        <h1 class="text-2xl font-bold mb-6 text-center">JWT Token Generator</h1>
        <form id="jwt-form">
            <div class="mb-4">
                <label for="payload" class="block text-gray-700">Payload:</label>
                <textarea id="payload" name="payload" rows="5" class="w-full p-2 border border-gray-300 rounded mt-1" placeholder='{"user": "example"}' required></textarea>
            </div>
            <div class="mb-4">
                <label for="secret" class="block text-gray-700">Secret:</label>
                <input type="text" id="secret" name="secret" class="w-full p-2 border border-gray-300 rounded mt-1" placeholder="Enter your secret key" required>
            </div>
            <button type="button" class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600" onclick="jwt.generateToken()">Generate Token</button>
            <div class="mt-4">
                <label for="token" class="block text-gray-700">Generated Token:</label>
                <div class="flex">
                    <textarea id="token" name="token" rows="5" class="w-full p-2 border border-gray-300 rounded mt-1" readonly></textarea>
                    <button type="button" class="ml-2 bg-green-600 text-white py-2 px-4 rounded hover:bg-green-700 self-end" onclick="jwt.copyToken()">Copy</button>
                </div>
            </div>
        </form>
        <div id="copy-notification" class="hidden fixed bottom-4 right-4 bg-gray-800 text-white py-2 px-4 rounded shadow-lg transition-opacity duration-300 opacity-0">
            Token copied to clipboard
        </div>
    </div>
    <script src="scripts/jwt.js"></script>
</body>
</html>
