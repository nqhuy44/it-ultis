<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base64 Encoder/Decoder</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-2xl">
        <h1 class="text-2xl font-bold mb-6 text-center">Base64 Encoder/Decoder</h1>
        <form id="base64-form">
            <div class="mb-4">
                <label for="input" class="block text-gray-700">Input:</label>
                <textarea id="input" name="input" rows="5" class="w-full p-2 border border-gray-300 rounded mt-1" placeholder="Enter text to encode or decode" required></textarea>
            </div>
            <div class="flex space-x-4">
                <button type="button" class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600" onclick="base64.encode()">Encode</button>
                <button type="button" class="w-full bg-red-500 text-white py-2 rounded hover:bg-red-600" onclick="base64.decode()">Decode</button>
            </div>
            <div class="mt-4">
                <label for="output" class="block text-gray-700">Output:</label>
                <div class="flex">
                    <textarea id="output" name="output" rows="5" class="w-full p-2 border border-gray-300 rounded mt-1" readonly></textarea>
                    <button type="button" class="ml-2 bg-green-600 text-white py-2 px-4 rounded hover:bg-green-700 self-end" onclick="base64.copyOutput()">Copy</button>
                </div>
            </div>
        </form>
        <div id="copy-notification" class="hidden fixed bottom-4 right-4 bg-gray-800 text-white py-2 px-4 rounded shadow-lg transition-opacity duration-300 opacity-0">
            Output copied to clipboard
        </div>
    </div>
    <script src="scripts/base64.js"></script>
</body>
</html>
